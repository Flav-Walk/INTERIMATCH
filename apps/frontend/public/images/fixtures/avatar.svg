<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Portrait de recette">
  <!--
    Portrait des jeux de recette.

    VOLONTAIREMENT ABSTRAIT. Un visage photographique laisserait croire que le
    produit connaît cette personne ; ce fichier ne sert qu'à satisfaire la règle
    de photo obligatoire dans les serveurs éphémères, où aucun utilisateur réel
    n'existe. Il ne doit jamais être servi en production : voir README.md.
  -->
  <defs>
