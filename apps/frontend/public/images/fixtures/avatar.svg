      <stop offset="0" stop-color="#dfeae3"/>
      <stop offset="1" stop-color="#c3d8cb"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bg)"/>
  <circle cx="80" cy="62" r="26" fill="#6f8f7c"/>
  <path d="M28 160c0-30.9 23.3-56 52-56s52 25.1 52 56Z" fill="#6f8f7c"/>
