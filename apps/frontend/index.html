<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="InteriMatch, les missions de l’hôtellerie-restauration qui vous correspondent."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Playfair Display porte les titres, Inter l'interface. Le produit affichait
      jusqu'ici les polices par defaut du navigateur (system-ui et Georgia) :
      rien ne signale plus surement une maquette inachevee.

      `display=swap` : le texte s'affiche tout de suite dans le repli declare
      par --font-display / --font-sans, puis bascule. Aucun ecran ne reste
      blanc en attendant le reseau, et une coupure ne casse que l'elegance.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>InteriMatch · Plateforme hôtellerie &amp; restauration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
